#:schema node_modules/wrangler/config-schema.json
#
# Deltakura v0 read API.
#
# Environments:
#   (top level)   local development only. Every id is a placeholder, which is
#                 intentional: `wrangler dev --local` ignores them, and a plain
#                 `wrangler deploy` without --env fails on them instead of
#                 overwriting production with dev-mode settings.
#   staging       placeholders; nothing has been created for it.
#   production    LIVE on the dedicated Workers Free account, served at
#                 https://deltakura-api.deltakura.workers.dev
#                 Deploy only with `npx wrangler deploy --env production`, after
#                 `npx wrangler whoami` shows the Deltakura account. `npm run
#                 deploy` exits 1 on purpose: a deploy is an operator action.
# The account id is never written here; wrangler reads CLOUDFLARE_ACCOUNT_ID.

name = "deltakura-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# No node builtins are used, so no compatibility flags are needed.

[vars]
DELTAKURA_MODE = "dev"
RELEASE = "0.1.0"
# Only origins the project controls. Add the custom domain once it is registered.
ALLOWED_ORIGINS = "https://deltakura-signals.web.app,https://deltakura-signals.firebaseapp.com"
RATE_LIMIT_PER_MINUTE = "60"
INTENT_RATE_LIMIT_PER_MINUTE = "20"

# IP_HASH_SALT is a secret, not a var - never put it in this file:
#   wrangler secret put IP_HASH_SALT                 (and --env staging / production)
# It salts the rate-limit hash (in memory only) and the intent de-duplication
# hash (KV, 25 h TTL). In prod mode POST /v0/intent refuses to count without it.

[[kv_namespaces]]
binding = "KV_INTENT"
id = "REPLACE_WITH_KV_INTENT_ID"          # wrangler kv namespace create KV_INTENT

[[kv_namespaces]]
binding = "KV_METRICS"
id = "REPLACE_WITH_KV_METRICS_ID"         # wrangler kv namespace create KV_METRICS

[[d1_databases]]
binding = "DB"
database_name = "signals"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # wrangler d1 create signals
migrations_dir = "migrations"

# No R2 bucket, by design. R2 is a paid-subscription product: binding it makes a
# deploy fail until someone subscribes the account, and subscribing bills the
# card on file. The procurement table ships bundled inside the Worker instead.
# CI (`.github/scripts/cost_guard.py`) fails on any r2_buckets block, and on
# every other Cloudflare feature that is not on the free plan.

[observability]
enabled = true

# ---------------------------------------------------------------- staging ---
[env.staging]
name = "deltakura-api-stg"
workers_dev = true

[env.staging.vars]
DELTAKURA_MODE = "prod"
RELEASE = "0.1.0-stg"
ALLOWED_ORIGINS = "https://deltakura-signals.web.app,http://localhost:5000"
RATE_LIMIT_PER_MINUTE = "60"
INTENT_RATE_LIMIT_PER_MINUTE = "20"

[[env.staging.kv_namespaces]]
binding = "KV_INTENT"
id = "REPLACE_WITH_STAGING_KV_INTENT_ID"

[[env.staging.kv_namespaces]]
binding = "KV_METRICS"
id = "REPLACE_WITH_STAGING_KV_METRICS_ID"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "signals-stg"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"

# ------------------------------------------------------------- production ---
[env.production]
name = "deltakura-api"
workers_dev = true
# routes are added only after the custom domain exists, which is a later phase:
# routes = [{ pattern = "api.deltakura.dev/v0/*", zone_name = "deltakura.dev" }]

[env.production.vars]
DELTAKURA_MODE = "prod"
RELEASE = "0.1.0"
ALLOWED_ORIGINS = "https://deltakura-signals.web.app,https://deltakura-signals.firebaseapp.com"
RATE_LIMIT_PER_MINUTE = "60"
INTENT_RATE_LIMIT_PER_MINUTE = "20"
# D1 holds the published daily counts (complete for the covered window) and the
# committed 1,500-record sample, not the full register, so lookups report
# complete=false. Set to "complete" only after the full register is loaded.
CORPORATE_RECORDS = "sample"

# Created 2026-09-23 on the dedicated Deltakura account (Workers Free).
# Resource ids are not secrets; the account id and IP_HASH_SALT never go here.
[[env.production.kv_namespaces]]
binding = "KV_INTENT"
id = "c38409cf5fc94a219ea7440aa1a9158a"   # KV namespace "KV_INTENT"

[[env.production.kv_namespaces]]
binding = "KV_METRICS"
id = "786cc1928cd349b3a076ccad84361c07"   # KV namespace "KV_METRICS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "signals"
database_id = "2ba9e92d-a6df-4f22-a8ae-d027f11deeea"   # D1 "signals", region APAC
migrations_dir = "migrations"
