source_id: pportal_awards
bet: A
product: Deltakura Tender Archive (JP) - national layer
publisher: デジタル庁 (Digital Agency) / 調達ポータル (GEPS)
page: https://www.p-portal.go.jp/pps-web-biz/UAB02/OAB0201
terms: https://www.p-portal.go.jp/pps-web-biz/resources/app/html/sitepolicy.html
spec: https://www.p-portal.go.jp/pps-web-biz/resources/app/pdf/rakusatsuopendata.pdf
license: 政府標準利用規約(第2.0版) / CC BY 4.0 compatible
attribution: 出典：調達ポータル（https://www.p-portal.go.jp/）
tos_matrix_row: 調達ポータル 落札実績オープンデータ
reuse_allowed: Y

access:
  method: direct-get
  # Resolved 2026-09-21, closing an open item in the source survey:
  # the page's doDownload() builds a plain GET against an API host.
  download_url_template: >
    https://api.p-portal.go.jp/pps-web-biz/UAB03/OAB0301?fileversion=v001&filename={filename}
  # The template is read from the listing page at runtime (variable
  # `uab02FileDownloadUrl`) rather than hard-coded, so a publisher-side change
  # is picked up instead of silently 404ing.
  listing_variable: uab02FileDownloadUrl
  all_file_pattern: successful_bid_record_info_all_{fiscal_year}.zip
  diff_file_pattern: successful_bid_record_info_diff_{YYYYMMDD}.zip
  robots: >
    api.p-portal.go.jp serves no robots.txt (403 JSON from the API gateway);
    www.p-portal.go.jp/robots.txt 302s to the auth service. No directives on
    either host; the site policy contains no anti-crawling clause.

publication:
  all_files: one per fiscal year, FY2013 onward, refreshed monthly
            (contents are as of the end of the previous month)
  diff_files: daily, retained about 2 months
  encoding: UTF-8 with BOM, CRLF, every field quoted, NO header row
  sizes: 全件 0.1-1.8 MB zipped per year; 差分 5-12 KB

csv_columns:   # verified against the spec PDF, 令和8年3月版
  1: 調達案件番号        # procurementItemNo, 19 chars
  2: 調達案件名称        # procurementItemNm
  3: 落札決定日          # successfulBidDate, YYYY-MM-DD
  4: 落札価格            # successfulBidPrice, decimal
  5: 府省コード          # ministryCd, 2 chars
  6: 入札方式コード      # biddingMethodCd, 7 chars
  7: 商号又は名称        # tradeNameKanji
  8: 法人番号            # corporationNo, 13 digits, OPTIONAL

not_published:
  - 予定価格   # so 落札率 cannot be computed from this source alone
  - 業種       # the closest available category is 府省 (the procuring body)
  - 都道府県   # national procurement; no location field exists
  - 入札参加者数

anonymisation: >
  Rules R1/R2 applied at ingest. A blank or checksum-invalid 法人番号 means
  the winner is masked to 個人事業主・<業種>・<都道府県>, whatever the name
  looks like. Titles pass the R4 person-name detector. Raw downloads stay out
  of any public repository.
