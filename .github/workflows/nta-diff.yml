name: nightly NTA registry diff

# Bet C. The 国税庁 法人番号公表サイト keeps each daily diff file for about 40 days
# and then deletes it, so a missed night is permanently unrecoverable — that gap
# is the entire product.
#
# REQUEST BUDGET (the number this job is accountable for)
#   normal night   2 requests, ~145 KB: one GET of the listing page, one POST to
#                  download the single new file.
#   after a gap    one request per missing day, in the same run, at >= 2 s per
#                  request to the one host; the 40-day window is the ceiling
#                  (~41 requests, ~5.5 MB) and `--daily-cap 60` in the collector
#                  is the hard brake.
#   never          no request at all for a day already held.
#
# The runner's collection store is thrown away with the runner, so "already
# held" cannot come from it. It comes from `data/published/nta/manifest.csv`,
# which this job commits: file id, date, sha256, byte size and row counts, no
# record content. `collect.py` seeds itself from that file, which is what keeps
# a normal night at two requests instead of forty-one.
#
# No secrets are required: the source is public, keyless open data published
# under 公共データ利用規約(第1.0版).
#
# What this job commits is `data/published/` and the Worker's bundled counts,
# and nothing else. The publisher's original file and the per-record normalized
# layer are written to the runner's scratch space and die with it. The Worker's
# committed record sample (`api/src/data/nta-sample.json`) is a fixed file and is
# NOT rebuilt here, so nightly history stays a few kilobytes a day.

on:
  schedule:
    # 03:30 JST = 18:30 UTC the previous day. Inside the 01:00-05:00
    # JST crawl window this project holds itself to. GitHub's scheduler can run late; the collector repairs
    # the whole 40-day window on each run, so a late or skipped night catches up.
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nta-diff
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Point the private collection store at the runner's scratch space
        # Ephemeral: it exists only for this run. Set through GITHUB_ENV because
        # the `runner` context is not available in job-level `env:`.
        run: echo "DELTAKURA_DATA_DIR=$RUNNER_TEMP/deltakura-data" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check requests

      - name: Collect the day's diff
        # run_nightly.py always appends a row to the private run log, including
        # on failure, and exits non-zero when the collector fails.
        run: python crawlers/nta_diff/run_nightly.py

      - name: Rebuild the published summary and the collection manifest
        # Merges the day just collected into the committed summary; days already
        # in the file are carried forward untouched. Writes both
        # data/published/nta/summary.json and data/published/nta/manifest.csv —
        # the manifest is what the next run reads to know what it already holds.
        run: python crawlers/nta_diff/publish_summary.py

      - name: Refresh the Worker's bundled counts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      - name: Refresh the bundled counts (not the fixed sample)
        # Deterministic: this rewrites nta-dev.json from the published summary
        # alone. nta-sample.json needs --refresh-sample and is never touched by
        # a scheduled run.
        run: npm run build-data
        working-directory: api

      - name: Commit the published summaries only
        run: |
          git config user.name "deltakura-bot"
          git config user.email "deltakura-bot@users.noreply.github.com"
          git add data/published api/src/data
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "data: nightly corporate-registry diff summary + manifest"
          git push

      - name: Run log
        if: always()
        run: tail -n 3 "$DELTAKURA_DATA_DIR/nta/run_log.csv" || echo "no run log"
