name: CI

# Everything here runs on a clean checkout with no secrets and no private data
# directory. That is the point: if the public repository cannot build and test
# itself, it is not publishable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing by default; each job asks for read access only.
# Third-party actions are pinned to full commit SHAs, not movable tags.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security-scan
    # Secrets, owner identifiers, home paths, .env files and anything under
    # data/ outside data/published/ - in the tree AND in every commit of the
    # history, so a secret removed in a later commit still fails the build.
    # Standard library only; no dependency is installed before it runs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tree and full history
        run: python3 .github/scripts/security_scan.py --history
      - name: Cost guard (free tiers only)
        # Fails on a paid or subscription-only Cloudflare feature in any
        # wrangler config (R2, Queues, Durable Objects, Hyperdrive, AI, Logpush,
        # custom domains, plan/billing keys, anything off the allowlist), on a
        # real `wrangler deploy` or `wrangler r2` in package scripts, and on a
        # paid-API SDK in any dependency manifest or lockfile. See api/README.md.
        run: python3 .github/scripts/cost_guard.py

  crawlers:
    name: crawlers (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the collectors' only dependency (pinned, hash-checked)
        run: python -m pip install --disable-pip-version-check --require-hashes -r crawlers/requirements.txt
      - name: Test suite
        # Anonymisation (R1-R6), parsers, politeness and the fail-closed source
        # clearance gate. No network: the HTTP layer runs against a stub.
        run: python crawlers/tests/run_tests.py

      - name: The published Bet-C summary and manifest match a fresh build
        # With no collection store, the builder rebuilds both published files
        # from the committed summary's own day table. They carry no build
        # timestamp, so this is a byte comparison: it proves the two artefacts
        # are self-consistent and reproducible by anyone who clones the repo.
        env:
          DELTAKURA_DATA_DIR: ${{ runner.temp }}/no-collection-store
        run: python crawlers/nta_diff/publish_summary.py --check

  packages:
    name: ${{ matrix.package }} (node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [mcp, api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # Lockfile-exact install; dependency install scripts are not run.
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.package }}
      - run: npm audit --audit-level=moderate
        working-directory: ${{ matrix.package }}
      - name: Rebuild the bundled data from data/published/
        # No private collection store here, and none is needed: every committed
        # bundle is a pure function of data/published/. Neither builder writes a
        # timestamp, and api/src/data/nta-sample.json is a fixed
        # file that `build-data` does not touch, so a rebuild is a no-op on a
        # clean checkout.
        run: npm run build-data
        working-directory: ${{ matrix.package }}
      - name: The committed bundles match a fresh build
        # Whole tree, not just this package: the MCP builder also writes the
        # published copy under data/published/, and those bytes must match too.
        run: git diff --exit-code
      - run: npm test
        working-directory: ${{ matrix.package }}

  site:
    name: site (build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and check invariants
        # No DELTAKURA_DATA_DIR here, so this also proves the site builds from
        # data/published/ alone. The build itself fails on a mailto:, a <form>,
        # an email address, a data page without attribution or JSON-LD, a page
        # over 100 KB or a tree over 50 MB.
        run: python site/build.py --check
